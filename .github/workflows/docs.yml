name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore LogAssertions.TUnit.slnx

      - name: Build (so XML docs exist in obj/)
        run: dotnet build LogAssertions.TUnit.slnx --configuration Release --no-restore

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Copy markdown sources into docs/
        run: |
          cp README.md docs/index.md
          cp CHANGELOG.md docs/changelog.md
          cp CONVENTIONS.md docs/conventions.md
          cp CONTRIBUTING.md docs/contributing.md
          cp CODE_OF_CONDUCT.md docs/coc.md
          cp SECURITY.md docs/security.md
          { echo "# License"; echo; echo '```'; cat LICENSE; echo '```'; } > docs/license.md

      - name: Build docs
        run: docfx docs/docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
